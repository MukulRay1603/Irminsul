[project]
name = "irminsul"
version = "1.0.0a0"
description = "Genshin Impact assistant built on official, version-aware game data"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "bm25s>=0.3.15",
    "fastembed>=0.9.1",
    "httpx>=0.27",
    "huggingface-hub>=1.33.0",
    "numpy>=2.5.4",
    "pydantic>=2.7",
]

[project.scripts]
irminsul-build = "irminsul.pipeline.build:main"
irminsul-notes = "irminsul.pipeline.notes:main"
irminsul-diff = "irminsul.pipeline.diff:main"
irminsul-publish = "irminsul.pipeline.publish:main"
irminsul-evalgen = "irminsul.evalgen:main"
irminsul-index = "irminsul.retrieval.evaluate:main"
irminsul-answer-eval = "irminsul.engine.evaluate:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/irminsul"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
