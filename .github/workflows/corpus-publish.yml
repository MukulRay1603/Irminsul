# Publish: when a reviewed corpus PR is merged, promote its staged HF branch to `main` and
# restart the Space. Routine daily changes publish directly from corpus-update.yml.
name: Publish corpus

on:
  push:
    branches: [main]
    paths: [corpus/STAGED]
  workflow_dispatch:

permissions: {} # granted per job below

env:
  HF_DATASET: MukulRay/irminsul-corpus
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write # the failure issue
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked --python 3.12

      - name: Promote the staged build
        if: env.HF_TOKEN != ''
        run: |
          staged="$(cat corpus/STAGED)"
          # The branch name comes from a merged PR: accept only the shape the update job writes.
          [[ "$staged" =~ ^update-[0-9]{4}-[0-9]{2}-[0-9]{2}(-[0-9]+)?$ ]] || { echo "bad STAGED: $staged"; exit 1; }
          uv run irminsul-publish promote --repo "$HF_DATASET" --branch "$staged"
          # The Space loads the dataset at boot: restart it so the site serves this build.
          uv run irminsul-publish restart-space --space MukulRay/Irminsul

      - name: No token
        if: env.HF_TOKEN == ''
        run: echo "HF_TOKEN not set; nothing to publish." >> "$GITHUB_STEP_SUMMARY"

      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Corpus publish failed ($(date -u +%F))" \
            --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
