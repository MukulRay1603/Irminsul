# Daily corpus check: build -> diff + guards -> (only if game data changed) index + retrieval
# gate -> stage on HF -> publish.
#
# - Nothing changed (most days): stop quietly. No PR, no issue, nothing to look at.
# - Routine change (corrected text, guide updates, new official videos): publish on its own
#   and restart the Space so the site serves it.
# - New or removed characters, weapons or sets, or a change in who is announced: open a review
#   PR instead. Merging it runs corpus-publish.yml. That is where a leak would show up, so a
#   person looks first.
# Daily (not weekly) so a patch's new characters are live within a day of release.
# Schedules only run from the default branch.
name: Daily corpus check

on:
  schedule:
    - cron: "17 9 * * *" # daily 09:17 UTC, after version-update maintenance has ended
  workflow_dispatch:
    inputs:
      reason:
        description: "Why run now (e.g. 'patch day 7.2')"
        required: false
        default: "manual run"

permissions: {} # granted per job below

concurrency:
  group: corpus-update
  cancel-in-progress: false

env:
  HF_DATASET: MukulRay/irminsul-corpus
  HF_SPACE: MukulRay/Irminsul
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  IRMINSUL_MODEL_CACHE: ${{ github.workspace }}/.models
  MIN_HIT_AT_8: "0.90"

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write # push the corpus/update-* branch for reviews
      pull-requests: write # open the review PR
      issues: write # the failure issue
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked --python 3.12

      - name: Previous manifest
        run: |
          mkdir -p prev
          if [ -n "$HF_TOKEN" ]; then
            uv run irminsul-publish fetch-manifest --repo "$HF_DATASET" --out prev || true
          fi
          if [ ! -f prev/manifest.json ] && [ -f corpus/manifest.json ]; then
            cp corpus/manifest.json prev/manifest.json
          fi

      - name: Build corpus (Yatta + HoYoWiki + KQM, leak-gated)
        run: uv run irminsul-build --out data/build

      - name: Diff, guards and decision
        id: diff
        run: |
          uv run irminsul-diff --old prev/manifest.json --new data/build/manifest.json \
            --out data/build/CHANGELOG.md --decision data/build/decision.json
          echo "changed=$(jq -r .changed data/build/decision.json)" >> "$GITHUB_OUTPUT"
          echo "review=$(jq -r .review data/build/decision.json)" >> "$GITHUB_OUTPUT"
          if [ "$(jq -r .changed data/build/decision.json)" != "true" ]; then
            echo "No game-data changes today. Nothing to publish." >> "$GITHUB_STEP_SUMMARY"
          else
            cat data/build/CHANGELOG.md >> "$GITHUB_STEP_SUMMARY"
            jq -r '.reasons[] | "- needs review: " + .' data/build/decision.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Cache embedding models
        if: steps.diff.outputs.changed == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .models
          key: models-bge-small-msmarco-v1

      - name: Index and retrieval quality gate
        if: steps.diff.outputs.changed == 'true'
        run: |
          uv run irminsul-index build --docs data/build/docs.jsonl --out data/index
          uv run irminsul-index eval --index data/index --k 8 --configs hybrid+rerank \
            --out data/build/retrieval.json --min-hit "$MIN_HIT_AT_8"

      - name: Keep the build as an artifact
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: corpus-${{ github.run_number }}
          path: |
            data/build
            data/index
          retention-days: 30

      - name: Stage on Hugging Face (dated branch)
        if: steps.diff.outputs.changed == 'true' && env.HF_TOKEN != ''
        run: |
          uv run irminsul-publish stage --repo "$HF_DATASET" --build data/build \
            --index data/index --branch "update-$(date -u +%F)"

      - name: Routine change, so publish now and restart the site
        if: steps.diff.outputs.changed == 'true' && steps.diff.outputs.review != 'true' && env.HF_TOKEN != ''
        run: |
          uv run irminsul-publish promote --repo "$HF_DATASET" --branch "update-$(date -u +%F)"
          uv run irminsul-publish restart-space --space "$HF_SPACE"
          echo "Published automatically (routine change) and restarted the Space." >> "$GITHUB_STEP_SUMMARY"

      - name: New content, so open the review PR
        if: steps.diff.outputs.changed == 'true' && steps.diff.outputs.review == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed as env, never interpolated into the script: the reason is free text.
          REASON: ${{ inputs.reason || 'scheduled' }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          day="$(date -u +%F)"
          branch="corpus/update-$day"
          mkdir -p corpus
          cp data/build/manifest.json corpus/manifest.json
          cp data/build/retrieval.json corpus/retrieval.json
          echo "update-$day" > corpus/STAGED
          { cat data/build/CHANGELOG.md; echo; [ -f corpus/CHANGELOG.md ] && cat corpus/CHANGELOG.md; } > /tmp/changelog
          mv /tmp/changelog corpus/CHANGELOG.md
          git switch -c "$branch"
          git add corpus
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "corpus: update $day ($REASON)"
          git push origin "$branch"
          staged="Staged on HF branch \`update-$day\`; merging publishes it and restarts the site."
          [ -z "$HF_TOKEN" ] && staged="HF_TOKEN not set: nothing staged; merging records the manifest only."
          { echo "**Why this needs a look:**"; jq -r '.reasons[] | "- " + .' data/build/decision.json; echo;
            cat data/build/CHANGELOG.md; echo; echo "$staged"; } > /tmp/body.md
          gh pr create --base "$BASE" --head "$branch" \
            --title "Corpus update $day (review: new content)" --body-file /tmp/body.md

      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Daily corpus check failed ($(date -u +%F))" \
            --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          A guard (record drop, unverified records, retrieval quality) or a source fetch failed.
          Nothing was published."
