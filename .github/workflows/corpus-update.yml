# Daily corpus check: build -> diff + guards -> (only if game data changed) index + retrieval
# gate -> stage on HF -> publish.
#
# - Nothing changed (most days): stop quietly. No PR, no issue, nothing to look at.
# - Changed: the publish gate (irminsul-safety) checks release dates, leak language in new or
#   changed docs, the offline leak/privacy/safety/spoiler probes and the size of the change.
#   All clean (new characters included): publish on its own and restart the Space.
# - Gate held it: open a review PR that says why. Merging it runs corpus-publish.yml.
# Daily (not weekly) so a patch's new characters are live within a day of release.
# On top of that, deep runs (irminsul-calendar decides) re-read every quest, book and build
# guide: weekly, and on the days the game changes. A deep run always publishes.
# Schedules only run from the default branch.
name: Daily corpus check

on:
  schedule:
    - cron: "17 9 * * *" # daily 09:17 UTC, after version-update maintenance has ended
    - cron: "47 21 * * *" # and again in the evening: GitHub often starts schedules hours late
  workflow_dispatch:
    inputs:
      reason:
        description: "Why run now (e.g. 'patch day 7.2')"
        required: false
        default: "manual run"
      deep:
        description: "Also re-read quests, books and guides"
        type: boolean
        default: false
      max_new:
        description: "New-doc limit for the publish gate (raise only to load a new source)"
        required: false
        default: "400"

permissions: {} # granted per job below

concurrency:
  group: corpus-update
  cancel-in-progress: false

env:
  HF_DATASET: MukulRay/irminsul-corpus
  HF_SPACE: MukulRay/Irminsul
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  IRMINSUL_MODEL_CACHE: ${{ github.workspace }}/.models
  MIN_HIT_AT_8: "0.90"

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write # push the corpus/update-* branch for reviews
      pull-requests: write # open the review PR
      issues: write # the failure issue
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked --python 3.12

      - name: Previous manifest
        run: |
          mkdir -p prev
          if [ -n "$HF_TOKEN" ]; then
            uv run irminsul-publish fetch-manifest --repo "$HF_DATASET" --out prev || true
          fi
          if [ ! -f prev/manifest.json ] && [ -f corpus/manifest.json ]; then
            cp corpus/manifest.json prev/manifest.json
          fi

      # The team's facts and build recommendations are kept out of the public repo: they come
      # from the private dataset. Missing files fail the run instead of publishing without them.
      - name: Curated team files (private dataset)
        if: env.HF_TOKEN != ''
        run: uv run irminsul-publish fetch-curated --repo "$HF_DATASET" --out config

      - name: Deep run today? (the game calendar decides)
        id: calendar
        env:
          FORCE: ${{ inputs.deep && '--force' || '' }}
        run: uv run irminsul-calendar --previous prev $FORCE

      - name: Build corpus (Yatta + HoYoWiki + KQM, leak-gated)
        env:
          DEEP: ${{ steps.calendar.outputs.deep == 'true' && '--deep' || '' }}
        run: uv run irminsul-build --out data/build --previous prev $DEEP

      - name: Diff, guards and decision
        id: diff
        env:
          DEEP: ${{ steps.calendar.outputs.deep }}
        run: |
          uv run irminsul-diff --old prev/manifest.json --new data/build/manifest.json \
            --out data/build/CHANGELOG.md --decision data/build/decision.json \
            --history prev/history.json --history-out data/build/history.json
          changed="$(jq -r .changed data/build/decision.json)"
          # A deep run always publishes, or the next run wouldn't know it happened
          [ "$DEEP" = "true" ] && changed=true
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "review=$(jq -r .review data/build/decision.json)" >> "$GITHUB_OUTPUT"
          if [ "$changed" != "true" ]; then
            echo "No game-data changes today. Nothing to publish." >> "$GITHUB_STEP_SUMMARY"
          else
            cat data/build/CHANGELOG.md >> "$GITHUB_STEP_SUMMARY"
            jq -r '.reasons[] | "- needs review: " + .' data/build/decision.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Cache embedding models
        if: steps.diff.outputs.changed == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .models
          key: models-bge-small-msmarco-v1

      - name: Index and retrieval quality gate
        if: steps.diff.outputs.changed == 'true'
        run: |
          uv run irminsul-index build --docs data/build/docs.jsonl --out data/index
          uv run irminsul-index eval --index data/index --k 8 --configs hybrid+rerank \
            --out data/build/retrieval.json --min-hit "$MIN_HIT_AT_8"
          # The public test results ship with the data, so they are never older than it
          uv run irminsul-report --build data/build --index data/index --out data/build/results.json

      - name: Publish gate (dates, leak language, probes, size)
        id: gate
        if: steps.diff.outputs.changed == 'true'
        env:
          MAX_NEW: ${{ inputs.max_new || '400' }}
        run: |
          uv run irminsul-safety --old prev/manifest.json --build data/build \
            --index data/index --out data/build/safety.json --max-new "$MAX_NEW"
          echo "auto=$(jq -r .auto_publish data/build/safety.json)" >> "$GITHUB_OUTPUT"
          if [ "$(jq -r .auto_publish data/build/safety.json)" = "true" ]; then
            echo "Publish gate passed: dates, leak language, probes and size are all clean." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Publish gate held this build:**" >> "$GITHUB_STEP_SUMMARY"
            jq -r '.problems[] | "- " + .' data/build/safety.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the build as an artifact
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: corpus-${{ github.run_number }}
          path: |
            data/build
            data/index
          retention-days: 30

      - name: Stage on Hugging Face (dated branch)
        if: steps.diff.outputs.changed == 'true' && env.HF_TOKEN != ''
        run: |
          uv run irminsul-publish stage --repo "$HF_DATASET" --build data/build \
            --index data/index --branch "update-$(date -u +%F)-$GITHUB_RUN_NUMBER"

      - name: Gate passed, so publish now and restart the site
        if: steps.diff.outputs.changed == 'true' && steps.gate.outputs.auto == 'true' && env.HF_TOKEN != ''
        run: |
          uv run irminsul-publish promote --repo "$HF_DATASET" --branch "update-$(date -u +%F)-$GITHUB_RUN_NUMBER"
          uv run irminsul-publish restart-space --space "$HF_SPACE"
          echo "Published automatically and restarted the Space." >> "$GITHUB_STEP_SUMMARY"

      - name: Gate held it, so open a review PR
        if: steps.diff.outputs.changed == 'true' && steps.gate.outputs.auto != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed as env, never interpolated into the script: the reason is free text.
          REASON: ${{ inputs.reason || 'scheduled' }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          # One name per run: a second update on the same day must still change corpus/STAGED,
          # or the publish workflow (which triggers on that file) never runs.
          day="$(date -u +%F)-$GITHUB_RUN_NUMBER"
          branch="corpus/update-$day"
          mkdir -p corpus
          cp data/build/manifest.json corpus/manifest.json
          cp data/build/retrieval.json corpus/retrieval.json
          echo "update-$day" > corpus/STAGED
          { cat data/build/CHANGELOG.md; echo; [ -f corpus/CHANGELOG.md ] && cat corpus/CHANGELOG.md; } > /tmp/changelog
          mv /tmp/changelog corpus/CHANGELOG.md
          git switch -c "$branch"
          git add corpus
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "corpus: update $day ($REASON)"
          git push origin "$branch"
          staged="Staged on HF branch \`update-$day\`; merging publishes it and restarts the site."
          [ -z "$HF_TOKEN" ] && staged="HF_TOKEN not set: nothing staged; merging records the manifest only."
          { echo "**The publish gate held this build because:**"; jq -r '.problems[] | "- " + .' data/build/safety.json; echo;
            cat data/build/CHANGELOG.md; echo; echo "$staged"; } > /tmp/body.md
          gh pr create --base "$BASE" --head "$branch" \
            --title "Corpus update $day (held by the publish gate)" --body-file /tmp/body.md

      # Unsafe is one question, out of date is another: compare the build with HoYoverse's own
      # notices. It runs after publishing, so a stale source raises an alarm without blocking.
      - name: Freshness check (official notices vs our data)
        run: uv run irminsul-freshness --build data/build

      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # One open issue, not one a day: the next run retries on its own anyway
          open="$(gh issue list --state open --search 'Daily corpus check failed in:title' \
            --json number --jq '.[0].number')"
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Failed again: $run"
          else
            gh issue create --title "Daily corpus check failed ($(date -u +%F))" \
              --body "Run: $run
          A guard (record drop, unverified records, retrieval quality), a source fetch or the
          freshness check failed. The site keeps serving the last good data."
          fi
